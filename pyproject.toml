[project]
name = "morphcloud"
version = '0.1.116'
description = 'A Python SDK and CLI tool for creating, managing, and interacting with Morph Cloud VMs.'
requires-python = '>=3.10'
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = [
    'requests>=2.32.3',
    'tqdm>=4.67.1',
    'httpx>=0.27.0',
    'pydantic>=2.10.3',
    'psutil>=6.1.0',
    'click>=8.1.7',
    'paramiko>=3.5.0',
    'pathspec>=0.12.1',
    'prompt_toolkit>=3.0.52',
    'rich>=13.9.4',
    'packaging>=24.2',
    'toml>=0.10.2',
    'websocket-client>=1.8.0',
    'pyyaml>=6.0.2',
]

[project.scripts]
morphcloud = "morphcloud.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morphcloud"]
